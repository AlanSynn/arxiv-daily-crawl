[project]
name = "arxiv-digest"
version = "0.1.0"
description = "Personal curated arXiv digest: daily score-ranked paper recommendations by email"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Alan Synn", email = "alan@alansynn.com"}
]
maintainers = [
    {name = "Alan Synn", email = "alan@alansynn.com"}
]
keywords = ["arxiv", "research", "newsletter", "recommendation", "academic-papers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "arxiv>=1.4.3",
    "requests>=2.28.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/AlanSynn/arxiv-digest"
Repository = "https://github.com/AlanSynn/arxiv-digest"
Issues = "https://github.com/AlanSynn/arxiv-digest/issues"
Documentation = "https://github.com/AlanSynn/arxiv-digest#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
# Installed src-layout style: the package is importable as top-level
# ``arxiv_digest`` (NOT ``src.arxiv_digest``), which is why the old
# ``src.daily_arxiv...`` entry points failed with ModuleNotFoundError.
arxiv-digest = "arxiv_digest.cli.main:main"
archive-papers = "arxiv_digest.archive.archiver:main"

[dependency-groups]
dev = [
    "ruff>=0.6.2",
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0",
]