# This is a basic workflow to help you get started with Actions

name: Run Daily Arxiv

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # 15:00 UTC = 11:00 AM EDT (summer) / 10:00 AM EST (winter).
    # Timed to run AFTER both feeds are fresh: arXiv posts overnight ET and
    # HuggingFace publishes its Daily Papers ~09:00 ET, so 15:00 UTC gives a
    # ~2h (summer) / ~1h (winter) buffer past HF's publish. Running earlier
    # risks an empty/stale HF section for that date, and because hf_papers
    # uses date_offset_days=0, a missed day is never recovered.
    - cron: "0 15 * * *"
  # Triggers the workflow on push or pull request events but only for the main branch
#   push:
#     branches:
#     - main

env:
  GITHUB_USER_NAME: AlanSynn
  GITHUB_USER_EMAIL: alan@alansynn.com
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: update
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch results branch
        run: |
          git fetch origin results:results || echo "Results branch doesn't exist yet"
          
      - name: Checkout results branch with existing logs
        run: |
          # Check if results branch exists
          if git show-ref --verify --quiet refs/heads/results; then
            echo "Results branch exists, checking it out"
            git checkout results
          else
            echo "Results branch doesn't exist yet, staying on main"
          fi
          
      - name: Merge main into results to get code updates
        run: |
          # If we're on results branch, merge main to get code updates
          if [ "$(git branch --show-current)" = "results" ]; then
            echo "Merging main into results for code updates"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            
            # Try to merge main into results
            if git merge origin/main -m "Merge main for code updates" --no-edit; then
              echo "Merge completed successfully"
            else
              # Check if merge failed due to conflicts
              if git status | grep -q "You have unmerged paths"; then
                echo "Merge conflicts detected, aborting and retrying with strategy"
                git merge --abort
                
                # Retry merge with strategy to prefer incoming changes from main for conflicts
                # WARNING: The -X theirs strategy will accept incoming changes from main and overwrite any conflicting changes in the results branch, including logs. This may result in loss of logs if there are conflicts in the logs directory.
                # SAFETY for notified_papers.json: this is only safe because logs/ stays gitignored on main (.gitignore:70), so main never carries a conflicting copy. If logs/ is ever force-added to main, this strategy would clobber the dedup state and cause re-sends.
                echo "Retrying merge with -X theirs strategy to accept code changes from main (may overwrite logs in case of conflicts)"
                git merge origin/main -m "Merge main for code updates" --no-edit -X theirs || exit 1
              else
                echo "Merge failed but no conflicts detected, likely no changes to merge"
              fi
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      
      - name: Install dependencies
        run: |
          uv sync

      - name: Set Up Environment
        run: |
          mkdir -p logs/json logs/md logs/archive # Ensure log directories exist
          if [ -f scripts/setup_logs.sh ]; then bash scripts/setup_logs.sh; fi

      - name: Validate CLI works
        run: |
          uv run python -m src.daily_arxiv --help

      - name: Run Daily Arxiv
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          uv run python -m src.daily_arxiv --send-email

      - name: Run Archive Old Papers
        continue-on-error: true
        run: |
          uv run python -m src.daily_arxiv.archive

      - name: Ensure on results branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # If not on results branch, create it
          if [ "$(git branch --show-current)" != "results" ]; then
            echo "Creating results branch"
            git checkout -b results
          fi

      - name: Commit files to results branch
        run: |
          # Add the logs directory to the results branch. -f is required
          # because .gitignore excludes logs/ (kept off main). Without -f the
          # add silently no-ops and neither the dated snapshots nor the email
          # dedup state (logs/notified_papers.json) ever persist — which is
          # why daily snapshots stopped landing after 2025-06-18.
          git add -f logs/ || echo "No logs to add"
          git commit -m "Update daily-arxiv papers - $(date +'%Y-%m-%d')" || echo "No changes to commit"

      - name: Push to results branch
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: results
          force: false
