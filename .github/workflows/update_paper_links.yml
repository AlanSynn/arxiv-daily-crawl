# This workflow is currently disabled as the update_paper_links functionality
# is not implemented in the current codebase structure.
# To re-enable, implement the --update_paper_links option in the CLI.

name: Update Paper Links Weekly (DISABLED)

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:  # manual trigger
  # schedule:
  #   - cron: "0 12 * * 1"  # Run every Monday at 8:00 AM EDT (12:00 UTC)

env:
  GITHUB_USER_NAME: AlanSynn
  GITHUB_USER_EMAIL: alan@alansynn.com
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: update
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: |
          uv sync

      - name: Set Up Environment
        run: |
          mkdir -p logs/json logs/md logs/archive # Ensure log directories exist
          if [ -f scripts/setup_logs.sh ]; then bash scripts/setup_logs.sh; fi

      # TODO: Implement --update_paper_links option in CLI
      - name: Update paper links (DISABLED)
        run: |
          echo "Update paper links functionality not implemented"
          echo "To enable, add --update_paper_links option to CLI"
          # uv run python -m src.daily_arxiv --update_paper_links

      - name: Create/switch to results branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -B results || git checkout results

      - name: Commit files to results branch
        run: |
          # Add only the logs directory to results branch
          git add logs/ || echo "No logs to add"
          git commit -m "Update paper links weekly - $(date +'%Y-%m-%d')" || echo "No changes to commit"

      - name: Push to results branch
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: results
          force: true