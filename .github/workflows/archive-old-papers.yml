name: Archive Old Papers Monthly

on:
  workflow_dispatch:  # manual trigger
  schedule:
    # 12:41 UTC on the 1st (≈8:41 AM EDT) — off the top-of-hour minute that
    # GitHub's scheduler jams (see daily-arxiv.yml).
    - cron: "41 12 1 * *"

# Serialize with the daily workflow: both rewrite the shared results branch
# tip (see daily-arxiv.yml for the lost-update rationale).
concurrency:
  group: results-state
  cancel-in-progress: false

permissions:
  contents: write

env:
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch results branch
        run: |
          git fetch origin results:results || echo "Results branch doesn't exist yet"
          
      - name: Checkout results branch with existing logs
        run: |
          # Check if results branch exists
          if git show-ref --verify --quiet refs/heads/results; then
            echo "Results branch exists, checking it out"
            git checkout results
          else
            echo "Results branch doesn't exist yet, staying on main"
          fi
          
      - name: Merge main into results to get code updates
        run: |
          # If we're on results branch, merge main to get code updates
          if [ "$(git branch --show-current)" = "results" ]; then
            echo "Merging main into results for code updates"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            
            # Try to merge main into results
            if git merge origin/main -m "Merge main for code updates" --no-edit; then
              echo "Merge completed successfully"
            else
              # Check if merge failed due to conflicts
              if git status | grep -q "You have unmerged paths"; then
                echo "Merge conflicts detected, aborting and retrying with strategy"
                git merge --abort
                
                # Retry merge with strategy to prefer incoming changes from main for conflicts
                # WARNING: This will accept changes from main and may overwrite changes in the results branch (including logs) if there are conflicts.
                # If logs must be preserved, add explicit handling to back up or restore the logs directory before/after the merge.
                echo "Retrying merge with -X theirs strategy to accept code changes from main"
                git merge origin/main -m "Merge main for code updates" --no-edit -X theirs || exit 1
              else
                echo "Merge failed but no conflicts detected, likely no changes to merge"
              fi
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: |
          uv sync

      - name: Set Up Environment
        run: |
          mkdir -p logs/json logs/md logs/archive # Ensure log directories exist

      - name: Run Archive Script
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          uv run python -m src.arxiv_digest.archive

      - name: Ensure on results branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # If not on results branch, create it
          if [ "$(git branch --show-current)" != "results" ]; then
            echo "Creating results branch"
            git checkout -b results
          fi

      - name: Commit files to results branch
        run: |
          # Force-add logs/: .gitignore excludes logs/ (kept off main), so a
          # plain `git add logs/` silently skips NEW untracked files — e.g. the
          # fresh logs/archive/archive_YYYYMM.* this run just created — while
          # still committing the deletions from logs/daily-arxiv.json. That is
          # the same failure class that stopped daily snapshots persisting
          # after 2025-06-18 (the daily workflow uses -f for the same reason).
          git add -f logs/
          git commit -m "Archive old papers (monthly) - $(date +'%Y-%m-%d')" || echo "No changes to commit"

      - name: Push to results branch
        run: |
          for attempt in 1 2 3; do
            if git push origin results; then
              exit 0
            fi
            echo "Push attempt $attempt failed; backing off"
            sleep $((attempt * 10))
          done
          echo "All push attempts failed"
          exit 1