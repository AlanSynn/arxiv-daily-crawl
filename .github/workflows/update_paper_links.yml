# This workflow is currently disabled as the update_paper_links functionality
# is not implemented in the current codebase structure.
# To re-enable, implement the --update_paper_links option in the CLI.

name: Update Paper Links Weekly (DISABLED)

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:  # manual trigger
  # schedule:
  #   - cron: "0 12 * * 1"  # Run every Monday at 8:00 AM EDT (12:00 UTC)

env:
  GITHUB_USER_NAME: AlanSynn
  GITHUB_USER_EMAIL: alan@alansynn.com
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: update
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch results branch
        run: |
          git fetch origin results:results || echo "Results branch doesn't exist yet"
          
      - name: Checkout results branch with existing logs
        run: |
          # Check if results branch exists
          if git show-ref --verify --quiet refs/heads/results; then
            echo "Results branch exists, checking it out"
            git checkout results
          else
            echo "Results branch doesn't exist yet, staying on main"
          fi
          
      - name: Merge main into results to get code updates
        run: |
          # If we're on results branch, merge main to get code updates
          if [ "$(git branch --show-current)" = "results" ]; then
            echo "Merging main into results for code updates"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            
            # Try to merge main into results
            if git merge origin/main -m "Merge main for code updates" --no-edit; then
              echo "Merge completed successfully"
            else
              # Check if merge failed due to conflicts
              if git status | grep -q "You have unmerged paths"; then
                echo "Merge conflicts detected, aborting and retrying with strategy"
                git merge --abort
                
                # Retry merge with strategy to prefer incoming changes from main for conflicts
                # This ensures we get the latest code from main while preserving logs
                echo "Retrying merge with -X theirs strategy to accept code changes from main"
                git merge origin/main -m "Merge main for code updates" --no-edit -X theirs
              else
                echo "Merge failed but no conflicts detected, likely no changes to merge"
              fi
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: |
          uv sync

      - name: Set Up Environment
        run: |
          mkdir -p logs/json logs/md logs/archive # Ensure log directories exist
          if [ -f scripts/setup_logs.sh ]; then bash scripts/setup_logs.sh; fi

      # TODO: Implement --update_paper_links option in CLI
      - name: Update paper links (DISABLED)
        run: |
          echo "Update paper links functionality not implemented"
          echo "To enable, add --update_paper_links option to CLI"
          # uv run python -m src.daily_arxiv --update_paper_links

      - name: Ensure on results branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # If not on results branch, create it
          if [ "$(git branch --show-current)" != "results" ]; then
            echo "Creating results branch"
            git checkout -b results
          fi

      - name: Commit files to results branch
        run: |
          # Add only the logs directory to results branch
          git add logs/ || echo "No logs to add"
          git commit -m "Update paper links weekly - $(date +'%Y-%m-%d')" || echo "No changes to commit"

      - name: Push to results branch
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: results
          force: false