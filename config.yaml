# =============================================================================
# arxiv-digest configuration
# =============================================================================
# The `categories:` block below is the source of truth for what we fetch.
# Each category maps a display name to:
#   cat_codes         - arXiv category codes (cs.GR, cs.CV, ...). Scoped search.
#   include_keywords  - phrases matched against the paper. By default these
#                       become `abs:"phrase"` clauses in the arXiv query AND
#                       substring matches in the relevance scorer.
#                       Prefix a keyword with `ti:` to match the TITLE only,
#                       e.g. `ti:world model` -> `ti:"world model"` (higher
#                       precision, lower recall).
#   weights           - OPTIONAL per-keyword multipliers (default 1.0), keyed
#                       by the keyword as written (ti: prefix optional). Rank
#                       signature phrases above generic ones — weights decide
#                       WHICH capped papers make the digest, not just order.
#   exclude_keywords  - applied client-side as a relevance penalty; NOT part
#                       of the arXiv query (arXiv has no robust NOT operator).
#   priority          - section ordering, higher = earlier (email + markdown).
# =============================================================================

show_authors: True
show_links: True
show_badge: True
max_results: 40

# file paths - all outputs go to logs directory
json_readme_path: './logs/daily-arxiv.json'
json_gitpage_path: './logs/daily-arxiv-web.json'

md_readme_path: './logs/ARXIV_PAPERS.md'
md_gitpage_path: './logs/arxiv-web.md'

# logs storage directory
log_dir: './logs'

# archive settings
archive_settings:
  enabled: True
  max_age_days: 365  # Papers older than this will be archived (1 year)
  archive_dir: './logs/archive'

# email settings
email_settings:
  enabled: True  # Set to True after configuring your SMTP settings
  smtp_server: "smtp.gmail.com"  # Update with your SMTP server
  smtp_port: 587
  smtp_user: "${SMTP_USER}"  # Will be replaced with GitHub secret
  smtp_password: "${SMTP_PASSWORD}"  # Will be replaced with GitHub secret

# send email
send_email: True
email_recipient: "${EMAIL_RECIPIENT}"  # Will be replaced with GitHub secret

# email dedup: each paper is dispatched at most once. The state file records
# already-emailed paper keys across runs so a stalled newest-day (e.g. arXiv's
# weekday-only posting over a weekend) never re-sends the same batch. The
# workflow force-commits logs/ (incl. this file) to the results branch.
email_dedup:
  enabled: True
  state_path: './logs/notified_papers.json'
  max_age_days: 30   # prune notified keys older than this (fetch window is 14d)

# HuggingFace Daily Papers — community-signal source. HF curates ~25
# papers/day by its own feature date (published ~09:00 EDT). These enter the
# digest as their own section, bypassing the arXiv publish-day slice and
# the readme/snapshots (email-only). They carry an arXiv id, so the same
# notified store above dedupes them across both sources — a paper already
# emailed via the keyword crawl is dropped here (and vice versa). The cron
# runs 10:30 EDT (14:30 UTC), safely after HF's morning publish.
hf_papers:
  enabled: true
  min_upvotes: 15     # floor for "notable" (HF median ~13; this keeps top-half)
  top_n: 10           # cap papers shown in the section
  section_name: "Trending on HuggingFace"
  date_offset_days: 0 # 0 = today's HF daily (cron runs 15:00 UTC, after HF's ~13:00 UTC publish)

# -----------------------------------------------------------------------------
# Relevance scoring (see src/arxiv_digest/processors/relevance.py)
# -----------------------------------------------------------------------------
# threshold is a weak filter by construction: include keywords are baked into
# the arXiv query, so every fetched paper scores >= one abstract hit. The
# per-category + global email caps below are what make the digest a digest.
scoring:
  threshold: 0.15              # drop papers below this normalized score
  title_weight: 2.0            # a title keyword hit is worth this many abstract hits
  include_boost: 1.0           # weight of one abstract keyword hit
  exclude_penalty: 1.0         # subtracted from the score when any exclude keyword hits
  email_max_per_category: 4    # digest shortlist: top-4 per section (0 = uncapped)
  email_max_total: 15          # ...and top-15 overall (0 = uncapped)

# -----------------------------------------------------------------------------
# Rate limiting & feature flags
# -----------------------------------------------------------------------------
rate_limit:
  arxiv_delay_seconds: 3.0      # arXiv requires >=3s between requests
  code_link_delay_seconds: 1.0  # throttle between HF Papers API calls
  code_link_enabled: true       # master kill switch for code-link lookups

# -----------------------------------------------------------------------------
# Table of contents / paper list (consumed by toc_generator in Wave 2)
# -----------------------------------------------------------------------------
toc:
  enabled: true
  paper_list_path: "./logs/PAPER_LIST.md"
  group_by_date: true

# =============================================================================
# Categories (the 10 merged MotionSmith-relevant areas)
# =============================================================================
categories:
  # ===== T1: MotionSmith core (motion + design + HCI) =====
  - name: "Character Motion Synthesis & Animation"
    cat_codes: ["cs.GR", "cs.CV"]
    priority: 9
    include_keywords:
      - "character animation"
      - "motion synthesis"
      - "motion generation"
      - "human motion"
      - "motion diffusion"
      - "physics-based motion"
      - "motion capture"
      - "skeletal animation"
      - "ti:character motion"   # title-only precision (bare ti:motion caught SfM/medical noise)
      - "ti:motion synthesis"
      - "ti:motion generation"
      - "ti:human motion"
    weights:                    # title hits outrank abstract buzzword matches
      "ti:character motion": 1.5
      "ti:motion synthesis": 1.5
      "ti:motion generation": 1.5
      "ti:human motion": 1.5
    exclude_keywords: ["motion planning", "optical flow", "sport", "structure from motion", "structure-from-motion", "myocardial", "eye reconstruction"]

  - name: "Motion Authoring, Editing & Retargeting"
    cat_codes: ["cs.GR", "cs.HC"]
    priority: 10
    include_keywords:
      - "motion authoring"
      - "motion editing"
      - "in-betweening"
      - "motion retargeting"
      - "pose authoring"
      - "inverse kinematics"
      - "generative motion rig"
      - "match animation"
      - "interactive motion"
    weights:                    # classic-animation mechanics are the core taste
      "in-betweening": 2.0
      "motion retargeting": 1.5
      "inverse kinematics": 1.5
    exclude_keywords: ["video editing", "image editing", "text editing"]

  - name: "Computational Design, Mechanism & Fabrication"
    cat_codes: ["cs.GR", "cs.HC", "cs.RO"]
    priority: 8
    include_keywords:
      - "computational fabrication"
      - "computational design"
      - "digital fabrication"
      - "mechanism design"        # scoped to GR/HC/RO so social/economic mech-design excluded
      - "linkage synthesis"
      - "kinematic synthesis"
      - "four-bar linkage"
      - "cam-follower"
      - "automata"
      - "3D printing"
    weights:                    # linkage/kinematic synthesis is the signature area
      "linkage synthesis": 3.0
      "kinematic synthesis": 3.0
      "four-bar linkage": 3.0
      "cam-follower": 2.5
      "3D printing": 0.75       # generic fabrication term — demote
    exclude_keywords: ["cathode", "anode", "battery", "crystalline", "perovskite", "supply chain", "powder bed fusion", "drug", "protein"]

  - name: "Sketch-based & Creative HCI Tools"
    cat_codes: ["cs.HC"]
    priority: 7
    include_keywords:
      - "sketch-based"
      - "ti:authoring"
      - "creative tool"
      - "design tool"
      - "co-creative"
      - "human-AI co-creation"
      - "interactive design system"
      - "participatory design"
    weights:
      "co-creative": 1.5
      "human-AI co-creation": 1.5
    exclude_keywords: []   # NOTE: low arXiv recall expected (CHI/UIST live in ACM DL)

  # ===== T2: must-include new areas =====
  - name: "Vision-Language & Action Models (VLA/VLM)"
    cat_codes: ["cs.RO", "cs.LG", "cs.CV", "cs.AI", "cs.CL"]
    priority: 9
    include_keywords:
      - "vision-language-action"
      - "vision language action"
      - "VLA"
      - "vision-language"          # include pure VLM too
      - "VLM"
      - "generalist robot policy"
      - "manipulation policy"
      - "diffusion policy"
      - "robot foundation model"
      - "action chunking"
      - "cross-embodiment"
    weights:                    # VLA-specific phrases outrank the generic VLM terms
      "vision-language-action": 2.0
      "vision language action": 2.0
      "generalist robot policy": 1.5
      "action chunking": 1.5
      "cross-embodiment": 1.5
      "vision-language": 0.75   # generic — every VLM paper matches
      "VLM": 0.75
    exclude_keywords: []

  - name: "World Models & Generative Video"
    cat_codes: ["cs.LG", "cs.CV", "cs.RO"]
    priority: 9
    include_keywords:
      - "ti:world model"           # title-only (abs:"world model" is noisy)
      - "ti:world models"
      - "world simulator"
      - "interactive video generation"
      - "video diffusion"
      - "action-conditioned video"
      - "video generation"
      - "human motion generation"
    weights:                    # title world-models = the real interest
      "ti:world model": 2.5
      "ti:world models": 2.5
      "world simulator": 2.0
      "action-conditioned video": 2.0
      "video generation": 0.75  # generic — matches half of cs.CV
    exclude_keywords: ["weather", "climate model", "economic model"]

  # ===== T3: supporting =====
  - name: "3D Understanding: Reconstruction & Generation"
    cat_codes: ["cs.CV", "cs.GR"]
    priority: 6
    include_keywords:
      - "3D reconstruction"
      - "Gaussian Splatting"
      - "neural radiance"
      - "3D generation"
      - "part segmentation"
      - "single-view 3D"
      - "text-to-3D"
    weights:
      "Gaussian Splatting": 1.5
      "text-to-3D": 1.5
    exclude_keywords: ["medical imaging", "CT reconstruction", "seismic", "remote sensing"]

  - name: "Embodied AI & Robot Learning"
    cat_codes: ["cs.RO", "cs.LG"]
    priority: 5
    include_keywords:
      - "sim-to-real"
      - "sim2real"
      - "affordance"
      - "dexterous manipulation"
      - "cross-embodiment learning"
      - "model-based reinforcement learning"
      - "robot skill learning"
    weights:
      "sim-to-real": 1.5
      "sim2real": 1.5
      "dexterous manipulation": 1.5
    exclude_keywords: ["SLAM", "path planning", "agriculture"]

  - name: "Narrative & Long-form Audio"
    cat_codes: ["cs.SD", "eess.AS"]
    priority: 4
    include_keywords:
      - "narrative audio"
      - "long-form audio"
      - "audio story"
      - "audio generation"
    weights:                    # narrative/long-form is the point; bare generation is noise
      "narrative audio": 2.0
      "audio story": 2.0
      "long-form audio": 1.5
      "audio generation": 0.75
    exclude_keywords: ["speech recognition", "speaker verification", "audio classification"]   # narrative/long-form ONLY

  - name: "Neural Rendering & Physics Simulation"
    cat_codes: ["cs.GR", "cs.CV"]
    priority: 5
    include_keywords:
      - "neural rendering"
      - "differentiable rendering"
      - "inverse rendering"
      - "fluid simulation"
      - "deformable simulation"
      - "cloth simulation"
      - "relightable"
    weights:
      "relightable": 2.0
      "differentiable rendering": 1.5
    exclude_keywords: ["CFD", "weather simulation", "plasma", "molecular dynamics"]
