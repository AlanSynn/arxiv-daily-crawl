name: Archive Old Papers Monthly

on:
  workflow_dispatch:  # manual trigger
  schedule:
    - cron: "0 12 1 * *"  # Run at 8:00 AM EDT (12:00 UTC) on the 1st of each month

env:
  GITHUB_USER_NAME: AlanSynn
  GITHUB_USER_EMAIL: alan@alansynn.com
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: |
          uv sync

      - name: Set Up Environment
        run: |
          mkdir -p logs/json logs/md logs/archive # Ensure log directories exist
          if [ -f scripts/setup_logs.sh ]; then bash scripts/setup_logs.sh; fi

      - name: Run Archive Script
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          uv run python -m src.daily_arxiv.archive

      - name: Create/switch to results branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -B results || git checkout results

      - name: Commit files to results branch
        run: |
          # Add only the logs directory to results branch
          git add logs/ || echo "No logs to add"
          git commit -m "Archive old papers (monthly) - $(date +'%Y-%m-%d')" || echo "No changes to commit"

      - name: Push to results branch
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: results
          force: true